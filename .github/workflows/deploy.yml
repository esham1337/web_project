name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ehtisham1337/flask-app:latest .

    - name: Push to DockerHub
      run: docker push ehtisham1337/flask-app:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker pull ehtisham1337/flask-app:latest
          sudo docker stop flask-container || true
          sudo docker rm flask-container || true
          sudo docker run -d -p 80:5000 --name flask-container ehtisham1337/flask-app:latest